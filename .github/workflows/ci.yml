name: CI — Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint with Ruff
        run: |
          ruff check --select=E,F,I --ignore=E501 .

      - name: Check imports
        run: |
          python -c "from agents.rag_agent import build_rag_chain; print('✅ rag_agent imports OK')"
          python -c "from agents.tool_calling_agent import run_agent_loop; print('✅ tool_calling_agent imports OK')"
          python -c "from agents.multi_agent import build_multi_agent_graph; print('✅ multi_agent imports OK')"
          python -c "from agents.memory_agent import MemoryAgent; print('✅ memory_agent imports OK')"
          python -c "from utils.llm_config import get_openai_llm, get_embeddings; print('✅ llm_config imports OK')"

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
