[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-toolkit"
version = "1.0.2"
description = "A small, readable toolkit of LLM agent patterns built on LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Kagitha" }]
keywords = ["llm", "agents", "langchain", "langgraph", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "faiss-cpu>=1.8.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
search = ["tavily-python>=0.4.0"]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.urls]
Repository = "https://github.com/kagithamanoj/ai-agent-toolkit"
Issues = "https://github.com/kagithamanoj/ai-agent-toolkit/issues"

[tool.setuptools]
packages = ["agents", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
